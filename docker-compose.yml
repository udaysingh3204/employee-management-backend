# Local MongoDB for development: `docker compose up -d`
# Then use MONGODB_URI=mongodb://127.0.0.1:27017/employee_management
services:
  mongo:
    image: mongo:7
    container_name: employee-management-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
